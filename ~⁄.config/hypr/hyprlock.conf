general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    color = rgba(245, 236, 215, 1.0)
    font_size = 90
    font_family = Source Code Pro
    position = 0, 160
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(245, 236, 215, 1.0)
    inner_color = rgba(28, 28, 30, 0.85)
    font_color = rgba(245, 236, 215, 1.0)
    check_color = rgba(224, 160, 48, 1.0)
    fail_color = rgba(200, 70, 70, 1.0)
